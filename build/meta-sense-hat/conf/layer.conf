# meta-sense-hat — host-side Sense HAT emulator environment for the SO3
# sense-hat bridge (sense-hat/sense-hat-server.py). pos_sol repo only.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# append layer name to list of configured layers
BBFILE_COLLECTIONS += "sense-hat"

LAYERSERIES_COMPAT_sense-hat = "infrabase_core"
LAYERDEPENDS_sense-hat = "core"

# and use name as suffix for other properties
BBFILE_PATTERN_sense-hat = "^${LAYERDIR}/"
BBFILE_PRIORITY_sense-hat = "10"
