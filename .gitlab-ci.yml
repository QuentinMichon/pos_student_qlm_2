stages:
  - build
  - release

build-rootfs:
  timeout: 2h
  stage: build
  image: redscalculator/pos-build:1.0
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - build/meta-rootfs/**/*
        - build/meta-usr/**/*
        - linux/rootfs/**/*
        - .gitlab-ci.yml
    - when: manual
  script:
    - source env.sh
    - IB_PLATFORM=virt32 build.sh rootfs-linux
    - mkdir -p artifacts/virt32/images
    - cp linux/rootfs/images/rootfs.cpio artifacts/virt32/images/rootfs.cpio
  artifacts:
    paths:
      - artifacts/

upload-rootfs:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-rootfs
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - build/meta-rootfs/**/*
        - build/meta-usr/**/*
        - linux/rootfs/**/*
        - .gitlab-ci.yml
  script:
    - tar -czf rootfs.tar.gz artifacts/*
    - GLAB_ENABLE_CI_AUTOLOGIN=true glab release create rootfs.v$CI_PIPELINE_IID --ref "$CI_COMMIT_SHA" --use-package-registry rootfs.tar.gz
