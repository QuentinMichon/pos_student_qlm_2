stages:
  - build
  - release

variables:
  IB_PLATFORM:
    value: "virt32"
    description: "Target platform to build (virt32, virt64, rpi4, rpi4_64, verdin-imx8mp). Override via 'Run pipeline' in the UI to build a different target."

build-rootfs:
  timeout: 2h
  stage: build
  image: redscalculator/pos-build:1.0
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - build/meta-rootfs/**/*
        - build/meta-usr/**/*
        - linux/rootfs/**/*
        - .gitlab-ci.yml
    - when: manual
  script:
    - source env.sh
    # The build reads the platform from local.conf only (an exported
    # IB_PLATFORM is ignored): switch its active IB_PLATFORM line, as
    # wt.sh add does, and fail if $IB_PLATFORM matched no line.
    - |
      sed -i -e 's/^IB_PLATFORM ?= /# IB_PLATFORM ?= /' \
             -e "s/^# IB_PLATFORM ?= \"$IB_PLATFORM\"/IB_PLATFORM ?= \"$IB_PLATFORM\"/" \
             build/conf/local.conf
    - grep -qx "IB_PLATFORM ?= \"$IB_PLATFORM\"" build/conf/local.conf
    - build.sh rootfs-linux
    - mkdir -p artifacts/$IB_PLATFORM/images
    - cp linux/rootfs/images/rootfs.cpio artifacts/$IB_PLATFORM/images/rootfs.cpio
  artifacts:
    paths:
      - artifacts/

upload-rootfs:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-rootfs
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - build/meta-rootfs/**/*
        - build/meta-usr/**/*
        - linux/rootfs/**/*
        - .gitlab-ci.yml
  script:
    - tar -czf rootfs.tar.gz artifacts/*
    - GLAB_ENABLE_CI_AUTOLOGIN=true glab release create rootfs.v$CI_PIPELINE_IID --ref "$CI_COMMIT_SHA" --use-package-registry rootfs.tar.gz
