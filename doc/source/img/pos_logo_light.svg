<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180"
     role="img" aria-label="POS — Operating System Porting">
  <title>POS — Operating System Porting</title>
  <desc>Two chips joined by an arrow: the same operating system carried from one
  target to another. Course logo, REDS Institute / HEIG-VD.</desc>

  <!-- Light-on-dark variant of pos_logo.svg, for the dark documentation
       sidebar (html_logo). Same geometry; slate replaced by white. Keep the
       two files in step. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">

    <!-- Source chip -->
    <g>
      <rect x="26" y="46" width="84" height="84" rx="10"/>
      <!-- pins -->
      <g stroke-width="4" stroke-linecap="round">
        <path d="M26 66 H14 M26 88 H14 M26 110 H14"/>
        <path d="M46 46 V34 M68 46 V34 M90 46 V34"/>
        <path d="M46 130 V142 M68 130 V142 M90 130 V142"/>
      </g>
      <!-- die -->
      <g fill="#FFFFFF" stroke="none">
        <rect x="46" y="66" width="18" height="18" rx="3"/>
        <rect x="72" y="66" width="18" height="18" rx="3"/>
        <rect x="46" y="92" width="18" height="18" rx="3"/>
        <rect x="72" y="92" width="18" height="18" rx="3"/>
      </g>
    </g>

    <!-- The port: same payload, new target -->
    <g stroke="#E0241A" stroke-width="7" stroke-linecap="round">
      <path d="M126 88 H186"/>
      <path d="M170 72 L188 88 L170 104" fill="none"/>
    </g>

    <!-- Target chip -->
    <g>
      <rect x="204" y="46" width="84" height="84" rx="10"/>
      <g stroke-width="4" stroke-linecap="round">
        <path d="M288 66 H300 M288 88 H300 M288 110 H300"/>
        <path d="M224 46 V34 M246 46 V34 M268 46 V34"/>
        <path d="M224 130 V142 M246 130 V142 M268 130 V142"/>
      </g>
      <g fill="#E0241A" stroke="none">
        <rect x="224" y="66" width="18" height="18" rx="3"/>
        <rect x="250" y="66" width="18" height="18" rx="3"/>
        <rect x="224" y="92" width="18" height="18" rx="3"/>
        <rect x="250" y="92" width="18" height="18" rx="3"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="330" y="100" font-size="72" font-weight="700" letter-spacing="6"
          fill="#FFFFFF">POS</text>
    <text x="332" y="128" font-size="17" letter-spacing="0.6" fill="#C9CDD6">
      Operating System Porting
    </text>
  </g>
</svg>
